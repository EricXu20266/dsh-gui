# dsh-gui workspace —— 把 deepseek-harness 整个并进来作为 workspace 成员
# 注意：嵌套 workspace 不生效，必须把 DHS 的所有 packages glob 在此展开
packages:
  - "."
  - "plugins/*"
  - "../deepseek-harness"
  - "../deepseek-harness/vendor/*"
  - "../deepseek-harness/packages/*/*"
  - "../deepseek-harness/native/landlock-run"
  - "../deepseek-harness/native/landlock-run/packages/*"
  - "../deepseek-harness/apps/*"
  - "../deepseek-harness/website"
  - "../deepseek-harness/examples"
  - "../deepseek-harness/python/sdk-runtime"

# 原生模块构建脚本白名单（pnpm 10+ strictDepBuilds 默认拒绝一切 install/build 脚本）
allowBuilds:
  '@biomejs/biome': true
  # 裸包名即可匹配 file: 工作区依赖；写 name@file:... 会被 pnpm 11 当作非法版本联合
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  lefthook: true
  node-addon-require-builtin: false
  node-pty: true
  protobufjs: false

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@earendil-works/pi-ai@0.82.1'
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4

# 复制自 deepseek-harness/pnpm-workspace.yaml（link: 路径按 workspace 根 dsh-gui 解析，需指回 DHS 仓库）
overrides:
  '@deepseek-ai/cosmokit': 'link:../deepseek-harness/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:../deepseek-harness/vendor/schemastery'
  # electron-builder 26.15.3 声明 @electron/get@^3 但代码用了 5.x 的 ElectronDownloadCacheMode
  # （@electron/get@3 无此导出 → resolveCacheMode 崩溃），强制 5.1.0
  '@electron/get': '^5.1.0'

patchedDependencies:
  node-pty@1.2.0-beta.15: ../deepseek-harness/patches/node-pty@1.2.0-beta.15.patch

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'
